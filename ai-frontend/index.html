<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumen | Chat IA</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #eef3f8;
      display: flex;
      justify-content: center;
      height: 100vh;
      align-items: center;
      margin: 0;
      color: #172b43;
    }

    .chat-container {
      width: min(420px, calc(100vw - 32px));
      background: white;
      border: 1px solid #d9e3ee;
      border-radius: 16px;
      box-shadow: 0 18px 48px rgba(28, 52, 78, 0.14);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: min(540px, calc(100vh - 32px));
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 18px;
      color: white;
      background: #173653;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: #2bb3a3;
      color: #10384a;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .chat-heading h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
    }

    .chat-heading p {
      margin: 4px 0 0;
      color: #c4d5e4;
      font-size: 12px;
    }

    .chat-box {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #f8fafc;
    }

    .message {
      padding: 11px 14px;
      border-radius: 14px;
      max-width: 80%;
      line-height: 1.4;
      overflow-wrap: anywhere;
      font-size: 14px;
    }

    .user {
      background: #2874d0;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }

    .assistant {
      background: #e6ebf0;
      color: #26394b;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 14px;
      background: #fff;
      border-top: 1px solid #e4eaf0;
    }

    .input-area input {
      flex: 1;
      min-width: 0;
      padding: 11px 13px;
      border: 1px solid #ccd8e3;
      border-radius: 9px;
      outline: none;
      font: inherit;
    }

    .input-area input:focus {
      border-color: #2874d0;
      box-shadow: 0 0 0 3px rgba(40, 116, 208, 0.12);
    }

    .input-area button {
      padding: 10px 16px;
      background: #173653;
      color: white;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }

    .input-area button:hover {
      background: #245477;
    }

    @media (max-width: 480px) {
      .chat-container {
        width: calc(100vw - 20px);
        height: calc(100vh - 20px);
      }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <div class="brand-mark" aria-hidden="true">L</div>
      <div class="chat-heading">
        <h1>Lumen IA</h1>
        <p>Asistente conversacional</p>
      </div>
    </header>
    <div id="chatBox" class="chat-box"></div>
    <div class="input-area">
      <input type="text" id="userInput" placeholder="Escribe tu mensaje..." onkeypress="handleKeyPress(event)">
      <button onclick="sendMessage()">Enviar</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
